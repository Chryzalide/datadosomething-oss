# The open donation channel (Story 5.5, FR-12 / CAP-11).
#
# GitHub renders this file as the repository's "Sponsor" button — the second of
# the two places FR-12 requires a working Ko-fi link, the first being the hub's
# footer. It is support only: donating unlocks no functionality anywhere in the
# suite.
#
