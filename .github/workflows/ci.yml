# CI for the PUBLIC Apache-2.0 repository.
#
# This file is not the upstream pipeline: the upstream one builds the hosted app's
# image and pushes it to a registry, which has no business running here. This
# repository builds and verifies the distributed artifact, and publishes nothing.
#
# It is copied verbatim by `scripts/oss-split.mjs` — edit it there, in the
# upstream monorepo, not in the generated repo.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Version & README sync gate
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            pnpm version:check --tag "${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_BASE_REF}" = "main" ]; then
            pnpm version:check --check-git-tag
          else
            pnpm version:check
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Boundaries (dependency gate)
        run: pnpm boundaries

      # The Apache-2.0 promise this repository makes: no non-commercially
      # licensed dependency in the distributed closure.
      - name: License check
        run: pnpm license-check

      - name: Build
        run: pnpm build

      # Prove the documented one-command deploy still works. Build only — the
      # image is yours to run, not ours to publish.
      - name: Build the container image
        run: docker build -f apps/selfhost/Dockerfile -t datadosomething-selfhost:ci .

  tag-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Ensure annotated Git tag vX.Y.Z on main
        run: |
          VERSION="$(node scripts/version.mjs current)"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists at $(git rev-parse --short "refs/tags/${TAG}^{commit}")."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            NOTES_FILE="$(mktemp)"
            node scripts/version.mjs release-notes --version "${VERSION}" > "${NOTES_FILE}"
            git tag -a "${TAG}" -F "${NOTES_FILE}"
            git push origin "refs/tags/${TAG}"
            rm -f "${NOTES_FILE}"
          fi
